name: checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/check.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix extension run test:host
      - if: runner.os == 'Windows'
        run: npm --prefix extension run test:host
